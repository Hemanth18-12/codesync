<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSync | Guide</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/guide.css">
    <link rel="stylesheet" href="css/dashboard.css"> <!-- Reuse sidebar -->
</head>
<body>
    <div class="global-bg"></div>

    <div class="dashboard-layout">
        
        <!-- Mobile Header -->
        <div class="mobile-header">
            <div class="brand"><i class="fa-solid fa-fire-flame-curved"></i> CodeSync Guide</div>
            <button class="btn-icon" onclick="document.getElementById('sidebar').classList.add('active')"><i class="fa-solid fa-bars"></i></button>
        </div>

        <!-- Sidebar (Reused) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand"><i class="fa-solid fa-fire-flame-curved"></i> <span>CodeSync</span></div>
                <button class="btn-icon mobile-close" onclick="document.getElementById('sidebar').classList.remove('active')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <nav class="sidebar-nav" style="padding-top: 2rem;">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-arrow-left"></i> <span>Back to App</span></a>
                <div class="nav-divider"></div>
                <div style="padding: 1rem 1.5rem; color:var(--text-muted); font-size:0.85rem; text-transform:uppercase; letter-spacing:1px;">Topics</div>
                <a class="nav-item active" onclick="guide.goToStep(0)"><i class="fa-solid fa-1"></i> <span>Account</span></a>
                <a class="nav-item" onclick="guide.goToStep(2)"><i class="fa-solid fa-2"></i> <span>Rooms</span></a>
                <a class="nav-item" onclick="guide.goToStep(5)"><i class="fa-solid fa-3"></i> <span>Editor</span></a>
                <a class="nav-item" onclick="guide.goToStep(7)"><i class="fa-solid fa-4"></i> <span>Execution</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="display:flex; flex-direction:column; padding:0;">
            
            <!-- Top Progress Bar -->
            <div class="guide-header glass-card">
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="step-dots" id="step-dots">
                    <!-- Dots generated by JS -->
                </div>
            </div>

            <div class="guide-body">
                
                <!-- Left: Mockup Area -->
                <div class="guide-mockup-area" id="mockup-area">
                    <div class="mockup-frame glass-card" id="mockup-frame">
                        <!-- Injected by JS based on step -->
                    </div>
                </div>

                <!-- Right: Content Area -->
                <div class="guide-content-area" id="content-area">
                    <div class="guide-text glass-card glow-border">
                        <h4 style="color:var(--accent-primary); text-transform:uppercase; font-size:0.85rem; letter-spacing:1px; margin-bottom:10px;" id="step-num">Step 1 of 8</h4>
                        <h2 id="step-title" style="margin-bottom:1rem; font-size:2rem;">Title</h2>
                        <p id="step-desc" style="color:var(--text-secondary); line-height:1.6; margin-bottom:2rem;">Description</p>
                        
                        <div class="pro-tip" id="step-tip">
                            <i class="fa-solid fa-lightbulb"></i> <span>Tip here</span>
                        </div>
                    </div>
                    
                    <div class="guide-nav">
                        <button class="btn btn-secondary" id="btn-prev" onclick="guide.prevStep()">Previous</button>
                        <button class="btn btn-primary" id="btn-next" onclick="guide.nextStep()">Next Step <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Success Confetti Canvas -->
    <canvas id="confetti" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9999; display:none;"></canvas>

    <script>
        const steps = [
            {
                title: "Create Your Account",
                desc: "CodeSync uses enterprise-grade Firebase authentication. You can sign in instantly using your Google account, or create a standard email/password combination.",
                tip: "Google Sign-in is the fastest way to get started and automatically pulls your avatar.",
                mockup: `
                    <div style="text-align:center; padding:2rem;">
                        <i class="fa-solid fa-fire-flame-curved" style="font-size:3rem; color:var(--accent-primary); margin-bottom:1rem;"></i>
                        <h3>Welcome to CodeSync</h3>
                        <div style="margin-top:2rem; padding:1rem; background:#fff; color:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:10px; border:2px solid var(--accent-primary); animation:pulse 2s infinite; font-weight:bold;">
                            <i class="fa-brands fa-google" style="color:#4285F4;"></i> Continue with Google
                        </div>
                    </div>
                `
            },
            {
                title: "Set Up Your Profile",
                desc: "Once logged in, your dashboard displays your unique profile. Your stats like 'Rooms Created' and 'Lines Written' are tracked in real-time.",
                tip: "Your initials are automatically extracted from your name to create your unique colored avatar across the app.",
                mockup: `
                    <div style="display:flex; flex-direction:column; gap:20px; padding:2rem; width:100%;">
                        <div class="glass-card" style="display:flex; gap:15px; padding:15px; align-items:center; animation:slideInRight 0.5s;">
                            <div class="avatar" style="width:50px; height:50px; border-color:var(--accent-primary);">JD</div>
                            <div>
                                <div style="font-weight:bold; font-size:1.2rem;">John Doe</div>
                                <div style="color:var(--text-muted); font-size:0.9rem;">john@dev.com</div>
                            </div>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <div class="glass-card" style="flex:1; padding:15px; text-align:center; border-top:2px solid var(--accent-primary);">
                                <div style="font-size:2rem; font-weight:bold;">12</div>
                                <div style="font-size:0.7rem; color:var(--text-muted);">Rooms</div>
                            </div>
                            <div class="glass-card" style="flex:1; padding:15px; text-align:center; border-top:2px solid var(--accent-primary);">
                                <div style="font-size:2rem; font-weight:bold;">4k</div>
                                <div style="font-size:0.7rem; color:var(--text-muted);">Lines</div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                title: "Create a Room",
                desc: "Workspaces in CodeSync are called 'Rooms'. When you create a room, a unique 6-digit alphanumeric code is instantly generated.",
                tip: "You can select the primary programming language for the room during creation, which sets the syntax highlighting for everyone.",
                mockup: `
                    <div class="glass-card glow-border" style="width:80%; padding:20px; text-align:center;">
                        <h4 style="margin-bottom:20px;">New Room</h4>
                        <div style="background:#111; padding:10px; border-radius:4px; margin-bottom:15px;">Project Alpha</div>
                        <div style="background:#111; padding:10px; border-radius:4px; margin-bottom:20px;">JavaScript</div>
                        <div style="border:2px dashed var(--accent-primary); padding:15px; border-radius:8px;">
                            <span style="font-family:monospace; font-size:2rem; letter-spacing:5px; color:var(--accent-primary); animation:typewriter 2s steps(6) infinite alternate; display:inline-block; overflow:hidden;">X7B9K2</span>
                        </div>
                    </div>
                `
            },
            {
                title: "Share Your Room",
                desc: "Inviting collaborators is seamless. You can either share the 6-digit code for them to enter on their dashboard, or copy the direct invite link.",
                tip: "Click on the room code badge inside the editor header to instantly copy the full URL to your clipboard.",
                mockup: `
                    <div style="width:100%; padding:2rem; display:flex; flex-direction:column; gap:20px;">
                        <div style="display:flex; justify-content:space-between; background:#222; padding:10px; border-radius:6px; align-items:center;">
                            <span style="font-family:monospace; color:var(--accent-primary);">X7B9K2</span>
                            <i class="fa-solid fa-copy" style="color:var(--success); animation:bounce 1s infinite;"></i>
                        </div>
                        <div class="toast success" style="position:relative; right:0; top:0; animation:slideUp 0.5s; width:100%;">
                            <span>Invite link copied to clipboard!</span>
                        </div>
                    </div>
                `
            },
            {
                title: "Invite Collaborators",
                desc: "When others join your room, their avatars instantly appear in the header. CodeSync supports multiple simultaneous connections.",
                tip: "Hover over any avatar in the header to see the user's full name.",
                mockup: `
                    <div style="width:100%; display:flex; justify-content:center; margin-top:20px;">
                        <div class="glass-card" style="display:flex; padding:10px 20px; border-radius:30px; gap:5px; align-items:center;">
                            <div class="avatar" style="width:40px; height:40px; border-color:#ff6b00; margin-left:0; animation:slideInRight 0.5s;">J</div>
                            <div class="avatar" style="width:40px; height:40px; border-color:#00ff88; margin-left:-15px; animation:slideInRight 0.5s 0.2s backwards;">S</div>
                            <div class="avatar" style="width:40px; height:40px; border-color:#4488ff; margin-left:-15px; animation:slideInRight 0.5s 0.4s backwards;">M</div>
                            <span style="margin-left:10px; font-size:0.9rem; color:var(--success);"><i class="fa-solid fa-circle"></i> 3 Online</span>
                        </div>
                    </div>
                `
            },
            {
                title: "Code Together",
                desc: "Experience zero-latency syncing powered by the Monaco Editor engine. You will see colored vertical bars indicating where your teammates are currently typing.",
                tip: "Each user is assigned a unique color when they join the room so you can easily identify who is typing what.",
                mockup: `
                    <div class="glass-card" style="width:90%; height:200px; background:#1e1e1e; padding:20px; text-align:left; position:relative; font-family:monospace; color:#dcdcaa;">
                        function calculate() {<br>
                        &nbsp;&nbsp;return <span style="color:#b5cea8">42</span>;<br>
                        }<br><br>
                        <span style="color:#569cd6">const</span> data = [];<br>
                        
                        <div style="position:absolute; top:40px; left:130px; border-left:2px solid #00ff88; height:15px;">
                            <div style="position:absolute; top:-15px; background:#00ff88; color:#000; font-size:10px; padding:2px; white-space:nowrap;">Sarah</div>
                        </div>
                        <div style="position:absolute; top:85px; left:160px; border-left:2px solid #ff6b00; height:15px; animation:blink 1s infinite;">
                            <div style="position:absolute; top:-15px; background:#ff6b00; color:#fff; font-size:10px; padding:2px; white-space:nowrap;">You</div>
                        </div>
                    </div>
                `
            },
            {
                title: "Use the Chat",
                desc: "Don't break your context by switching to Slack. Use the built-in side chat panel to communicate with your team.",
                tip: "If you start a message with ``` it will automatically render as a formatted code block in the chat.",
                mockup: `
                    <div class="glass-card" style="width:80%; height:250px; display:flex; flex-direction:column; padding:15px; background:var(--bg-surface);">
                        <div style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin-bottom:10px;">Today</div>
                        
                        <div style="display:flex; gap:10px; margin-bottom:15px;">
                            <div class="avatar" style="width:25px; height:25px; font-size:10px; border-color:#00ff88;">S</div>
                            <div style="background:#2a2a2a; padding:8px; border-radius:0 10px 10px 10px; font-size:0.8rem; width:80%;">Can you check the API route?</div>
                        </div>
                        
                        <div style="display:flex; gap:10px; margin-bottom:15px; flex-direction:row-reverse;">
                            <div class="avatar" style="width:25px; height:25px; font-size:10px; border-color:#ff6b00;">Y</div>
                            <div style="background:var(--accent-primary); padding:8px; border-radius:10px 0 10px 10px; font-size:0.8rem; width:80%;">Sure, looking now.</div>
                        </div>

                        <div style="font-size:0.7rem; color:var(--accent-primary); margin-top:auto;">Sarah is typing<span>.</span><span>.</span><span>.</span></div>
                    </div>
                `
            },
            {
                title: "Run Your Code",
                desc: "Execute your JavaScript instantly inside a secure iframe sandbox directly in the browser. Console outputs and errors appear in the bottom panel.",
                tip: "Use the keyboard shortcut Ctrl+Enter to instantly run your code without clicking the button.",
                mockup: `
                    <div style="width:100%; display:flex; flex-direction:column; gap:10px;">
                        <button class="btn btn-primary" style="align-self:center; animation:pulse 2s infinite;"><i class="fa-solid fa-play"></i> Run Code</button>
                        
                        <div class="glass-card" style="background:#0a0a0a; padding:10px; font-family:monospace; font-size:0.8rem; height:150px; text-align:left;">
                            <div style="color:#ddd; border-bottom:1px solid #333; padding:5px 0;">[CodeSync] Running javascript...</div>
                            <div style="color:#fff; border-bottom:1px solid #333; padding:5px 0;">Hello World!</div>
                            <div style="color:#f48771; border-bottom:1px solid #333; padding:5px 0;"><i class="fa-solid fa-triangle-exclamation"></i> ReferenceError: data is not defined</div>
                            <div style="color:#75beff; font-style:italic; padding:5px 0;">&lt;- undefined</div>
                        </div>
                    </div>
                `
            }
        ];

        const guide = {
            current: 0,
            
            init: function() {
                // Generate dots
                const dots = document.getElementById('step-dots');
                steps.forEach((_, i) => {
                    const d = document.createElement('div');
                    d.className = 'dot';
                    d.onclick = () => this.goToStep(i);
                    dots.appendChild(d);
                });
                
                // check localstorage for saved progress (mocked here by just showing)
                this.render();
            },

            render: function() {
                const step = steps[this.current];
                
                // Update text
                document.getElementById('step-num').innerText = `Step ${this.current + 1} of ${steps.length}`;
                document.getElementById('step-title').innerText = step.title;
                document.getElementById('step-desc').innerText = step.desc;
                document.getElementById('step-tip').innerHTML = `<i class="fa-solid fa-lightbulb"></i> <span>${step.tip}</span>`;
                
                // Update mockup with animation reset
                const m = document.getElementById('mockup-frame');
                m.innerHTML = step.mockup;
                m.style.animation = 'none';
                m.offsetHeight; /* trigger reflow */
                m.style.animation = null; 
                
                // Update UI states
                document.getElementById('progress-bar').style.width = `${((this.current + 1) / steps.length) * 100}%`;
                
                const dots = document.querySelectorAll('.dot');
                dots.forEach((d, i) => {
                    d.className = 'dot';
                    if(i < this.current) d.classList.add('done');
                    if(i === this.current) d.classList.add('active');
                });

                // Buttons
                const btnNext = document.getElementById('btn-next');
                if(this.current === steps.length - 1) {
                    btnNext.innerHTML = 'Finish <i class="fa-solid fa-check"></i>';
                    btnNext.classList.remove('btn-primary');
                    btnNext.style.background = 'var(--success)';
                } else {
                    btnNext.innerHTML = 'Next Step <i class="fa-solid fa-arrow-right"></i>';
                    btnNext.style.background = '';
                    btnNext.className = 'btn btn-primary';
                }
                
                document.getElementById('btn-prev').style.display = this.current === 0 ? 'none' : 'block';
            },

            nextStep: function() {
                if(this.current < steps.length - 1) {
                    this.current++;
                    this.render();
                } else {
                    this.finish();
                }
            },

            prevStep: function() {
                if(this.current > 0) {
                    this.current--;
                    this.render();
                }
            },

            goToStep: function(i) {
                this.current = i;
                this.render();
            },

            finish: function() {
                document.getElementById('step-title').innerText = "You're ready!";
                document.getElementById('step-desc').innerText = "You have completed the guide. You are now ready to build faster together.";
                document.getElementById('mockup-frame').innerHTML = `<i class="fa-solid fa-rocket" style="font-size:6rem; color:var(--success); animation:slideUp 1s forwards;"></i>`;
                document.getElementById('btn-next').style.display = 'none';
                document.getElementById('step-tip').style.display = 'none';
                
                // Show confetti
                const c = document.getElementById('confetti');
                c.style.display = 'block';
                // Simple confetti mockup (real implementation would use canvas particles)
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                ctx.fillStyle = 'rgba(0,255,136,0.5)';
                for(let i=0; i<100; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*5+2, 0, Math.PI*2);
                    ctx.fill();
                }
                
                setTimeout(() => window.location.href = 'dashboard.html', 3000);
            }
        };

        window.onload = () => guide.init();
    </script>
</body>
</html>
