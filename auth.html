<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | CodeSync</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-layout">
    <div class="toast-container" id="toast-container"></div>

    <div class="auth-form-container">
        <div class="auth-nav">
            <a href="index.html" class="logo">
                <span class="logo-icon">&lt;/&gt;</span>
                <span class="logo-text">CodeSync</span>
            </a>
        </div>

        <div class="auth-header">
            <h1 id="auth-title">Welcome Back</h1>
            <p id="auth-subtitle">Log in to sync your code and collaborate.</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login">Log In</button>
            <button class="tab-btn" data-tab="signup">Sign Up</button>
        </div>

        <div class="oauth-buttons">
            <button class="btn-oauth" id="btn-google">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
            </button>
            <button class="btn-oauth" id="btn-github">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                Continue with GitHub
            </button>
        </div>

        <div class="divider">or</div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="fade-form">
            <div class="form-group">
                <input type="email" id="login-email" class="form-input" placeholder=" " required>
                <label for="login-email" class="form-label">Email Address</label>
                <div class="error-msg" id="login-email-err"></div>
            </div>
            <div class="form-group">
                <input type="password" id="login-pwd" class="form-input" placeholder=" " required>
                <label for="login-pwd" class="form-label">Password</label>
                <div class="error-msg" id="login-pwd-err"></div>
            </div>
            <button type="submit" class="btn-primary btn-submit" id="btn-login-submit">
                <span class="btn-text">Log In</span>
            </button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                <a href="#" id="forgot-pwd-link" style="color: var(--primary-color);">Forgot Password?</a>
            </p>
        </form>

        <!-- SIGNUP FORM (Hidden initially) -->
        <form id="signup-form" class="hidden fade-form">
            <div class="form-group">
                <input type="text" id="signup-name" class="form-input" placeholder=" " required minlength="2">
                <label for="signup-name" class="form-label">Full Name</label>
                <div class="error-msg" id="signup-name-err"></div>
            </div>
            <div class="form-group">
                <input type="email" id="signup-email" class="form-input" placeholder=" " required>
                <label for="signup-email" class="form-label">Email Address</label>
                <div class="error-msg" id="signup-email-err"></div>
            </div>
            <div class="form-group">
                <input type="password" id="signup-pwd" class="form-input" placeholder=" " required minlength="8">
                <label for="signup-pwd" class="form-label">Password (min 8 chars)</label>
                <div class="error-msg" id="signup-pwd-err"></div>
                <div class="password-strength" id="pwd-strength">
                    <div class="strength-bars">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                    <div class="strength-text" id="strength-text">Weak</div>
                </div>
            </div>
            <button type="submit" class="btn-primary btn-submit" id="btn-signup-submit">
                <span class="btn-text">Create Account</span>
            </button>
        </form>

        <!-- RESET PWD FORM (Hidden initially) -->
        <form id="reset-form" class="hidden fade-form">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Enter your email and we'll send you a password reset link.</p>
            <div class="form-group">
                <input type="email" id="reset-email" class="form-input" placeholder=" " required>
                <label for="reset-email" class="form-label">Email Address</label>
                <div class="error-msg" id="reset-email-err"></div>
            </div>
            <button type="submit" class="btn-primary btn-submit" id="btn-reset-submit">
                <span class="btn-text">Send Reset Link</span>
            </button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                <a href="#" id="back-to-login" style="color: var(--primary-color);">Back to Log In</a>
            </p>
        </form>

    </div>

    <!-- VISUAL PANEL (Right Side) -->
    <div class="auth-visual">
        <div class="visual-background"></div>
        <div class="visual-content">
            <div class="code-mockup">
                <div class="mockup-header">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
                <div class="mockup-body" id="auth-typing">
                    <!-- Typing effect by JS -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
